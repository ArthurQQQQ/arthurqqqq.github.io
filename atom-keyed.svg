<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" data-active-step="1" role="img" aria-labelledby="atom-title atom-desc">
  <title id="atom-title">Atom-Keyed Retrieval mechanism</title>
  <desc id="atom-desc">The query ranks short atomic propositions. A stored source identifier traces a selected atom back to its original passage. The reader receives selected passages within a context budget.</desc>
  <defs>
    <pattern id="atom-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#53668e" stroke-opacity=".33"/>
    </pattern>
    <marker id="atom-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l6 3-6 3" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <radialGradient id="atom-rank-light" cx="50%" cy="51%" r="70%">
      <stop stop-color="#456bad" stop-opacity=".56"/>
      <stop offset="1" stop-color="#456bad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atom-source-light" cx="33%" cy="51%" r="70%">
      <stop stop-color="#3a8f79" stop-opacity=".51"/>
      <stop offset="1" stop-color="#3a8f79" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atom-reader-light" cx="76%" cy="51%" r="67%">
      <stop stop-color="#9f7747" stop-opacity=".48"/>
      <stop offset="1" stop-color="#9f7747" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #eceef9; }
    .heading { font: 22px Georgia, serif; }
    .band-label { fill: #b4bbd2; font-size: 14px; letter-spacing: .06em; }
    .node-label { font-size: 16px; font-weight: 560; }
    .path-note { fill: #b4bbd2; font-size: 14px; }
    .rank-box, .source-box, .reader-box { fill: #192130; stroke: #65759a; stroke-width: 1.5; }
    .rank-ink, .source-ink, .reader-ink { fill: none; stroke: #91a2cd; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .rank-line, .trace-line, .read-line { fill: none; stroke: #8795ba; stroke-width: 1.6; marker-end: url(#atom-arrow); }
    .trace-line, .read-line { stroke-dasharray: 4 5; }
    .focus-light { opacity: 0; }
    .rank-note, .trace-note, .read-note { opacity: 0; }
    svg[data-active-step="1"] .rank-light,
    svg[data-active-step="2"] .source-light,
    svg[data-active-step="3"] .reader-light {
      opacity: calc(.64 + .30 * var(--scroll-accent, 0));
    }
    svg[data-active-step="1"] .rank-note,
    svg[data-active-step="2"] .trace-note,
    svg[data-active-step="3"] .read-note { opacity: 1; }
    svg[data-active-step="1"] .rank-box { fill: #243a60; stroke: #99b5ff; }
    svg[data-active-step="1"] .rank-line, svg[data-active-step="1"] .rank-ink { stroke: #99b5ff; }
    svg[data-active-step="2"] .chosen-atom,
    svg[data-active-step="2"] .source-box,
    svg[data-active-step="3"] .source-box { fill: #173932; stroke: #79d9c3; }
    svg[data-active-step="2"] .source-ink, svg[data-active-step="2"] .chosen-ink,
    svg[data-active-step="3"] .source-ink { stroke: #79d9c3; }
    svg[data-active-step="2"] .trace-line,
    svg[data-active-step="3"] .trace-line { stroke: #79d9c3; stroke-dasharray: none; }
    svg[data-active-step="3"] .reader-box { fill: #3e3024; stroke: #e9bf8a; }
    svg[data-active-step="3"] .reader-ink, svg[data-active-step="3"] .read-line { stroke: #e9bf8a; }
    svg[data-active-step="3"] .read-line { stroke-dasharray: none; }
    @media (prefers-reduced-motion: no-preference) {
      .focus-light { transition: opacity .26s ease; }
      .rank-box, .source-box, .reader-box { transition: fill .24s ease, stroke .24s ease; }
      .rank-ink, .source-ink, .reader-ink, .rank-line, .trace-line, .read-line {
        transition: stroke .24s ease;
      }
    }
    @media (max-width: 400px) {
      .heading { font-size: 24px; }
      .band-label, .path-note { font-size: 16px; }
      .node-label { font-size: 18px; }
    }
    svg[data-scroll-driven] * { transition: none; }
    .scroll-signal { display: none; pointer-events: none; }
    svg[data-scroll-driven][data-active-step="1"] .signal-one,
    svg[data-scroll-driven][data-active-step="2"] .signal-two,
    svg[data-scroll-driven][data-active-step="3"] .signal-three {
      display: inline;
      transform: translateX(calc(var(--phase-progress, 0) * var(--travel)));
    }
  </style>
  <rect width="560" height="250" fill="#141824"/>
  <rect x=".5" y=".5" width="559" height="249" rx="13" fill="none" stroke="#30374f"/>
  <text class="heading" x="25" y="35">Atoms and source passages</text>
  <path d="M25 50h510" stroke="#3e4865"/>
  <rect x="24" y="65" width="249" height="141" rx="9" fill="#1b2337" stroke="#394361"/>
  <rect x="287" y="65" width="249" height="141" rx="9" fill="#1a2132" stroke="#394361"/>
  <rect class="focus-light rank-light" x="24" y="65" width="249" height="141" rx="9" fill="url(#atom-rank-light)"/>
  <rect class="focus-light source-light" x="287" y="65" width="249" height="141" rx="9" fill="url(#atom-source-light)"/>
  <rect class="focus-light reader-light" x="287" y="65" width="249" height="141" rx="9" fill="url(#atom-reader-light)"/>
  <path d="M33 66h231a8 8 0 0 1 8 8v123a8 8 0 0 1-8 8H33a8 8 0 0 1-8-8V74a8 8 0 0 1 8-8Zm263 0h231a8 8 0 0 1 8 8v123a8 8 0 0 1-8 8H296a8 8 0 0 1-8-8V74a8 8 0 0 1 8-8Z" fill="url(#atom-grid)"/>
  <text class="band-label" x="38" y="87">RANKING UNIT</text>
  <text class="band-label" x="301" y="87">READING UNIT</text>

  <path class="rank-line" d="M112 136h52"/>
  <path class="trace-line" d="M239 136h82"/>
  <path class="read-line" d="M400 136h57"/>
  <rect class="rank-box" x="50" y="116" width="57" height="41" rx="7"/>
  <path class="rank-ink" d="M65 136a7 7 0 1 1 14 0 7 7 0 0 1-14 0Zm12 5 7 6"/>
  <g>
    <rect class="rank-box" x="169" y="106" width="65" height="16" rx="4" opacity=".6"/>
    <rect class="rank-box chosen-atom" x="169" y="128" width="65" height="16" rx="4"/>
    <rect class="rank-box" x="169" y="150" width="65" height="16" rx="4" opacity=".6"/>
    <path class="rank-ink chosen-ink" d="M190 136h32"/>
    <path d="M179 135h1m-1 2h1" stroke="#eceef9" stroke-width="2" stroke-linecap="round"/>
    <path d="M180 114h40m-40 44h38" stroke="#93a5c8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <rect class="source-box" x="326" y="107" width="69" height="60" rx="7"/>
  <path d="M338 120h43m-43 32h32" stroke="#93a5c8" stroke-linecap="round" stroke-width="1.5"/>
  <path class="source-ink" d="M338 131h40m-40 10h34"/>
  <rect class="reader-box" x="462" y="110" width="51" height="54" rx="7"/>
  <path class="reader-ink" d="M481 124h-7v26h7m13-26h7v26h-7m-12-18h11m-11 9h11"/>

  <g class="node-label" text-anchor="middle">
    <text x="78" y="188">Query</text>
    <text x="201" y="188">Atoms</text>
    <text x="361" y="188">Source chunk</text>
    <text x="487" y="188">Reader</text>
  </g>
  <path class="rank-note" d="M25 228h18" stroke="#99b5ff" stroke-width="2"/>
  <path class="trace-note" d="M25 228h18" stroke="#79d9c3" stroke-width="2"/>
  <path class="read-note" d="M25 228h18" stroke="#e9bf8a" stroke-width="2"/>
  <text class="path-note rank-note" x="51" y="233">Rank short propositions against the query.</text>
  <text class="path-note trace-note" x="51" y="233">Follow the selected atom’s stored source link.</text>
  <text class="path-note read-note" x="51" y="233">Send original passage context to the reader.</text>
  <circle class="scroll-signal signal-one" cx="119" cy="136" r="2.9" fill="#c9d7ff" style="--travel: 39px"/>
  <circle class="scroll-signal signal-two" cx="246" cy="136" r="2.9" fill="#a7f3d9" style="--travel: 69px"/>
  <circle class="scroll-signal signal-three" cx="407" cy="136" r="2.9" fill="#ffe1b0" style="--travel: 43px"/>
</svg>
