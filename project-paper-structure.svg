<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" data-active-step="1" role="img" aria-labelledby="structure-figure-title structure-figure-desc">
  <title id="structure-figure-title">Trace the argument</title>
  <desc id="structure-figure-desc">Read the source PDF. Trace claims to highlighted evidence and review a suggested edit before authorizing it.</desc>
  <defs>
    <pattern id="structure-figure-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#53668e" stroke-opacity=".22"/>
    </pattern>
  </defs>
  <style>
    text { font: 20px system-ui, sans-serif; fill: #eceef9; }
    .heading { font: 27px Georgia, serif; }
    .note { font-size: 19px; fill: #b9c4e2; }
    .source { --weight: var(--weight-one, 1); --accent: #99b5ff; --tint: #243a60; }
    .map { --weight: var(--weight-two, 0); --accent: #79d9c3; --tint: #173932; }
    .edit { --weight: var(--weight-three, 0); --accent: #e9bf8a; --tint: #3e3024; }
    .surface {
      fill: #192130;
      stroke: #59698a;
      stroke-width: 1.6;
      fill: color-mix(in srgb, #192130, var(--tint) calc(100% * var(--weight)));
      stroke: color-mix(in srgb, #59698a, var(--accent) calc(100% * var(--weight)));
    }
    .glyph {
      fill: none;
      stroke: #a4b2d3;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke: color-mix(in srgb, #a4b2d3, var(--accent) calc(100% * var(--weight)));
    }
    .route { fill: none; stroke: #66779d; stroke-width: 1.7; stroke-linejoin: round; }
    .selection {
      opacity: calc(.3 + .5 * var(--weight-one, 1));
      transform: scaleX(calc(.7 + .3 * var(--progress-one, 0)));
      transform-origin: 70px 138px;
    }
    .trace {
      opacity: var(--weight-two, 0);
      stroke-dasharray: 1;
      stroke-dashoffset: calc(1 - var(--progress-two, 0));
    }
    .approval {
      opacity: var(--weight-three, 0);
      stroke-dasharray: 1;
      stroke-dashoffset: calc(1 - var(--progress-three, 0));
    }
  </style>
  <rect x=".5" y=".5" width="559" height="249" rx="12" fill="#141824" stroke="#30374f"/>
  <text class="heading" x="25" y="36">Trace the argument</text>
  <path d="M25 50.5h510" stroke="#3e4865"/>
  <rect x="25" y="64" width="510" height="139" rx="8" fill="url(#structure-figure-grid)" stroke="#30374f"/>

  <path class="route" d="M140 138h28a10 10 0 0 1 10 10v3a10 10 0 0 0 10 10h13m-6-5 6 5-6 5M276 118v21m-5-6 5 6 5-6"/>
  <path class="route" d="M350 161h11a10 10 0 0 0 10-10v-11a10 10 0 0 1 10-10h11m-6-5 6 5-6 5" stroke-dasharray="4 4"/>
  <path class="trace" d="M140 138h28a10 10 0 0 1 10 10v3a10 10 0 0 0 10 10h13l-6-5m81-38v21l-5-6" pathLength="1" fill="none" stroke="#79d9c3" stroke-width="2.2" stroke-linecap="round"/>
  <path class="approval" d="M350 161h11a10 10 0 0 0 10-10v-11a10 10 0 0 1 10-10h11l-6-5" pathLength="1" fill="none" stroke="#e9bf8a" stroke-width="2.2" stroke-linecap="round"/>

  <g class="source">
    <path class="surface" d="M58 76h59l22 22v84H58a6 6 0 0 1-6-6V82a6 6 0 0 1 6-6Z"/>
    <path class="glyph" d="M117 76v22h22M70 105h30m-30 17h50m-50 15h50m-50 15h44m-44 15h27"/>
    <path class="selection" d="M70 137h48" fill="none" stroke="#99b5ff" stroke-width="7" stroke-linecap="round"/>
    <text x="95" y="100" text-anchor="middle" font-size="18">PDF</text>
  </g>

  <g class="map">
    <rect class="surface" x="202" y="76" width="148" height="42" rx="7"/>
    <path class="glyph" d="M218 97l6-6 6 6-6 6Zm17 0h8"/>
    <text x="250" y="104">Claim</text>
    <rect class="surface" x="202" y="139" width="148" height="44" rx="7"/>
    <path class="glyph" d="M218 154h20m-20 7h20m-20 7h12"/>
    <text x="249" y="168">Evidence</text>
  </g>

  <g class="edit">
    <rect class="surface" x="392" y="78" width="132" height="105" rx="8"/>
    <text x="458" y="108" text-anchor="middle">Review edit</text>
    <path class="glyph" d="M409 130h68m-68 13h52m-52 13h34"/>
    <circle class="surface" cx="499" cy="155" r="12"/>
    <path d="m493 155 4 4 8-8" fill="none" stroke="#a4b2d3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".58"/>
    <path class="approval" d="m493 155 4 4 8-8" pathLength="1" fill="none" stroke="#e9bf8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="note" x="26" y="232">You decide which edits to apply.</text>
</svg>
