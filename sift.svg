<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" data-active-step="1" role="img" aria-labelledby="sift-title sift-desc">
  <title id="sift-title">SIFT feature reweighting mechanism</title>
  <desc id="sift-desc">Examples from tabular rows become short written scenes. A language model scores the original features, and normalized scores reweight inputs for a conventional tabular model.</desc>
  <defs>
    <pattern id="sift-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#53668e" stroke-opacity=".33"/>
    </pattern>
    <marker id="sift-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l6 3-6 3" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <radialGradient id="sift-example-light" cx="50%" cy="46%" r="70%">
      <stop stop-color="#456bad" stop-opacity=".56"/>
      <stop offset="1" stop-color="#456bad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sift-score-light" cx="50%" cy="46%" r="70%">
      <stop stop-color="#3a8f79" stop-opacity=".51"/>
      <stop offset="1" stop-color="#3a8f79" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sift-model-light" cx="67%" cy="46%" r="70%">
      <stop stop-color="#9f7747" stop-opacity=".48"/>
      <stop offset="1" stop-color="#9f7747" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #eceef9; }
    .heading { font: 22px Georgia, serif; }
    .band-label { fill: #b4bbd2; font-size: 14px; letter-spacing: .06em; }
    .node-label { font-size: 16px; font-weight: 560; }
    .path-note { fill: #b4bbd2; font-size: 14px; }
    .band { fill: #1a2132; stroke: #394361; }
    .box { fill: #192130; stroke: #65759a; stroke-width: 1.5; }
    .detail { fill: none; stroke: #91a2cd; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: #8795ba; stroke-width: 1.6; marker-end: url(#sift-arrow); }
    .flow-scores, .flow-model { stroke-dasharray: 3 4; }
    .focus-light { opacity: 0; }
    .examples, .scores, .model { opacity: .84; }
    .note-examples, .note-scores, .note-model { opacity: 0; }
    svg[data-active-step="1"] .examples,
    svg[data-active-step="2"] .scores,
    svg[data-active-step="3"] .model,
    svg[data-active-step="1"] .note-examples,
    svg[data-active-step="2"] .note-scores,
    svg[data-active-step="3"] .note-model { opacity: 1; }
    svg[data-active-step="1"] .examples .focus-light,
    svg[data-active-step="2"] .scores .focus-light,
    svg[data-active-step="3"] .model .focus-light {
      opacity: calc(.64 + .30 * var(--scroll-accent, 0));
    }
    svg[data-active-step="1"] .examples .band { fill: #1b2a43; stroke: #536d9b; }
    svg[data-active-step="1"] .examples .box { fill: #243a60; stroke: #99b5ff; }
    svg[data-active-step="1"] .examples .detail, svg[data-active-step="1"] .flow-examples { stroke: #99b5ff; }
    svg[data-active-step="2"] .scores .band { fill: #142e2c; stroke: #37685f; }
    svg[data-active-step="2"] .scores .box { fill: #173932; stroke: #79d9c3; }
    svg[data-active-step="2"] .scores .detail, svg[data-active-step="2"] .flow-scores { stroke: #79d9c3; }
    svg[data-active-step="2"] .flow-scores, svg[data-active-step="3"] .flow-model { stroke-dasharray: none; }
    svg[data-active-step="3"] .model .band { fill: #2e261f; stroke: #73583b; }
    svg[data-active-step="3"] .model .box { fill: #3e3024; stroke: #e9bf8a; }
    svg[data-active-step="3"] .model .detail, svg[data-active-step="3"] .flow-model { stroke: #e9bf8a; }
    @media (prefers-reduced-motion: no-preference) {
      .focus-light, .examples, .scores, .model { transition: opacity .26s ease; }
      .band, .box { transition: fill .24s ease, stroke .24s ease; }
      .detail, .flow { transition: stroke .24s ease; }
    }
    @media (max-width: 400px) {
      .heading { font-size: 24px; }
      .band-label, .path-note { font-size: 16px; }
      .node-label { font-size: 17.5px; }
    }
    svg[data-scroll-driven] * { transition: none; }
    .examples, .flow-examples {
      --focus-weight: var(--weight-one, 1);
      --focus-band: #1b2a43;
      --focus-edge: #536d9b;
      --focus-fill: #243a60;
      --focus-ink: #99b5ff;
    }
    .scores, .flow-scores {
      --focus-weight: var(--weight-two, 0);
      --focus-band: #142e2c;
      --focus-edge: #37685f;
      --focus-fill: #173932;
      --focus-ink: #79d9c3;
    }
    .model, .flow-model {
      --focus-weight: var(--weight-three, 0);
      --focus-band: #2e261f;
      --focus-edge: #73583b;
      --focus-fill: #3e3024;
      --focus-ink: #e9bf8a;
    }
    svg[data-scroll-driven] :is(.examples, .scores, .model, .flow) {
      --focus-strength: calc(var(--focus-weight) * 100%);
    }
    svg[data-scroll-driven] :is(.examples, .scores, .model) {
      opacity: calc(.84 + .16 * var(--focus-weight));
    }
    svg[data-scroll-driven] :is(.examples, .scores, .model) .focus-light {
      opacity: calc(.82 * var(--focus-weight));
    }
    svg[data-scroll-driven] :is(.examples, .scores, .model) .band {
      fill: color-mix(in srgb, var(--focus-band) var(--focus-strength), #1a2132);
      stroke: color-mix(in srgb, var(--focus-edge) var(--focus-strength), #394361);
    }
    svg[data-scroll-driven] :is(.examples, .scores, .model) .box {
      fill: color-mix(in srgb, var(--focus-fill) var(--focus-strength), #192130);
      stroke: color-mix(in srgb, var(--focus-ink) var(--focus-strength), #65759a);
    }
    svg[data-scroll-driven] :is(.examples, .scores, .model) .detail {
      stroke: color-mix(in srgb, var(--focus-ink) var(--focus-strength), #91a2cd);
    }
    svg[data-scroll-driven] .flow {
      stroke: color-mix(in srgb, var(--focus-ink) var(--focus-strength), #8795ba);
      stroke-dasharray: none;
    }
    .scroll-signal { display: none; pointer-events: none; }
    .signal-one { --signal-weight: var(--weight-one, 1); --signal-progress: var(--progress-one, 0); }
    .signal-two { --signal-weight: var(--weight-two, 0); --signal-progress: var(--progress-two, 0); }
    .signal-three { --signal-weight: var(--weight-three, 0); --signal-progress: var(--progress-three, 0); }
    svg[data-scroll-driven] .scroll-signal {
      display: inline;
      opacity: var(--signal-weight);
      transform: translateX(calc(var(--signal-progress) * var(--travel)));
    }
  </style>
  <rect width="560" height="250" fill="#141824"/>
  <rect x=".5" y=".5" width="559" height="249" rx="13" fill="none" stroke="#30374f"/>
  <text class="heading" x="25" y="35">Scene-guided feature weights</text>
  <path d="M25 50h510" stroke="#3e4865"/>

  <g class="examples">
    <rect class="band" x="24" y="65" width="160" height="141" rx="9"/>
    <rect class="focus-light" x="25" y="66" width="158" height="139" rx="8" fill="url(#sift-example-light)"/>
    <rect x="25" y="66" width="158" height="139" rx="8" fill="url(#sift-grid)"/>
    <text class="band-label" x="37" y="87">EXAMPLES</text>
    <rect class="box" x="38" y="108" width="48" height="48" rx="5"/>
    <path class="detail" d="M38 123h48m-48 15h48m-32-15v33m16-33v33"/>
    <path class="flow flow-examples" d="M91 131h20"/>
    <path class="box" d="M116 110h47a5 5 0 0 1 5 5v27a5 5 0 0 1-5 5h-24l-10 9v-9h-13a5 5 0 0 1-5-5v-27a5 5 0 0 1 5-5Z"/>
    <path class="detail" d="M122 121h33m-33 8h27m-27 8h21"/>
    <text class="node-label" x="104" y="188" text-anchor="middle">Rows to scenes</text>
  </g>

  <g class="scores">
    <rect class="band" x="200" y="65" width="160" height="141" rx="9"/>
    <rect class="focus-light" x="201" y="66" width="158" height="139" rx="8" fill="url(#sift-score-light)"/>
    <rect x="201" y="66" width="158" height="139" rx="8" fill="url(#sift-grid)"/>
    <text class="band-label" x="213" y="87">FEATURE PRIOR</text>
    <rect class="box" x="220" y="108" width="120" height="16" rx="4"/>
    <rect class="box" x="220" y="130" width="120" height="16" rx="4"/>
    <rect class="box" x="220" y="152" width="120" height="16" rx="4"/>
    <path class="detail" d="M231 116h45m-45 22h45m-45 22h45m44-44h7m-7 22h7m-7 22h7"/>
    <text class="node-label" x="280" y="188" text-anchor="middle">LLM scores columns</text>
  </g>

  <g class="model">
    <rect class="band" x="376" y="65" width="160" height="141" rx="9"/>
    <rect class="focus-light" x="377" y="66" width="158" height="139" rx="8" fill="url(#sift-model-light)"/>
    <rect x="377" y="66" width="158" height="139" rx="8" fill="url(#sift-grid)"/>
    <text class="band-label" x="389" y="87">MODEL INPUT</text>
    <rect class="box" x="391" y="114" width="42" height="43" rx="5"/>
    <path class="detail" d="M401 125h21m-21 10h21m-21 10h21m16-20h9l17 10m-26 0h26m-26 10h9l17-10"/>
    <rect class="box" x="472" y="110" width="48" height="51" rx="6"/>
    <path class="detail" d="M496 123v10m0 0-9 9m9-9 9 9"/>
    <circle cx="496" cy="122" r="3" fill="#eceef9"/>
    <circle cx="487" cy="145" r="3" fill="#eceef9"/>
    <circle cx="505" cy="145" r="3" fill="#eceef9"/>
    <text class="node-label" x="456" y="188" text-anchor="middle">Weighted features</text>
  </g>

  <path class="flow flow-scores" d="M187 135h12"/>
  <path class="flow flow-model" d="M363 135h12"/>
  <path class="note-examples" d="M25 228h18" stroke="#99b5ff" stroke-width="2"/>
  <path class="note-scores" d="M25 228h18" stroke="#79d9c3" stroke-width="2"/>
  <path class="note-model" d="M25 228h18" stroke="#e9bf8a" stroke-width="2"/>
  <text class="path-note note-examples" x="51" y="233">Describe example rows in natural language.</text>
  <text class="path-note note-scores" x="51" y="233">Estimate the importance of the original features.</text>
  <text class="path-note note-model" x="51" y="233">Normalize the scores and reweight model inputs.</text>
  <circle class="scroll-signal signal-one" cx="93" cy="131" r="3.3" fill="#c9d7ff" style="--travel: 16px"/>
  <circle class="scroll-signal signal-two" cx="233" cy="138" r="3.3" fill="#a7f3d9" style="--travel: 41px"/>
  <circle class="scroll-signal signal-three" cx="440" cy="135" r="3.3" fill="#ffe1b0" style="--travel: 22px"/>
</svg>
