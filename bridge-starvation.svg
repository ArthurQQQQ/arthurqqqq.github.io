<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" data-active-step="1" role="img" aria-labelledby="bridge-title bridge-desc">
  <title id="bridge-title">Bridge Starvation mechanism</title>
  <desc id="bridge-desc">A first search may retrieve an initial clue while leaving its support unseen. A bounded extra search uses the bridge entity in the clue to look for the supporting passage.</desc>
  <defs>
    <pattern id="bridge-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#b8cde4" stroke-opacity=".33"/>
    </pattern>
    <marker id="bridge-blue-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#3679b5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="bridge-mint-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#1c766c" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #172e47; }
    .heading { font: 22px Georgia, serif; }
    .band-label { fill: #46627c; font-size: 14px; letter-spacing: .06em; }
    .node-label { font-size: 16px; font-weight: 560; }
    .path-note { fill: #46627c; font-size: 14px; }
    .known { fill: #dfefff; stroke: #3679b5; stroke-width: 1.5; }
    .future { fill: #f5f9fd; stroke: #83a1be; stroke-width: 1.5; }
    .known-ink { fill: none; stroke: #3679b5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .future-ink { fill: none; stroke: #537796; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .gap { fill: none; stroke: #a66521; stroke-width: 1.5; stroke-dasharray: 4 5; }
    .path-note.on-single { fill: #8a5318; }
    .on-repair { display: none; }
    svg[data-active-step="2"] .on-single { display: none; }
    svg[data-active-step="2"] .on-repair { display: inline; }
    svg[data-active-step="2"] .future { fill: #d8f1e9; stroke: #1c766c; }
    svg[data-active-step="2"] .future-ink { stroke: #1c766c; }
    svg[data-active-step="2"] .late-band { fill: #edf9f5; stroke: #9ccbbf; }
    @media (max-width: 400px) {
      .heading { font-size: 24px; }
      .band-label, .path-note { font-size: 16px; }
      .node-label { font-size: 18px; }
    }
  </style>
  <rect width="560" height="250" fill="#fbfdff"/>
  <rect x=".5" y=".5" width="559" height="249" rx="13" fill="none" stroke="#aac5df"/>
  <text class="heading" x="25" y="35">Evidence path</text>
  <path d="M25 50h510" stroke="#bdd2e8"/>
  <rect x="24" y="65" width="249" height="141" rx="9" fill="#edf5fd" stroke="#c4d8eb"/>
  <rect class="late-band" x="287" y="65" width="249" height="141" rx="9" fill="#f4f8fc" stroke="#c4d8eb"/>
  <path d="M33 66h231a8 8 0 0 1 8 8v123a8 8 0 0 1-8 8H33a8 8 0 0 1-8-8V74a8 8 0 0 1 8-8Zm263 0h231a8 8 0 0 1 8 8v123a8 8 0 0 1-8 8H296a8 8 0 0 1-8-8V74a8 8 0 0 1 8-8Z" fill="url(#bridge-grid)"/>
  <text class="band-label" x="38" y="87">INITIAL LOOKUP</text>
  <text class="band-label" x="301" y="87">FOLLOW-UP LOOKUP</text>

  <path d="M114 137h63" stroke="#3679b5" fill="none" stroke-width="1.6" marker-end="url(#bridge-blue-arrow)"/>
  <path class="gap on-single" d="M243 137h63m66 0h79"/>
  <g class="on-repair" fill="none" stroke="#1c766c" stroke-width="1.8" marker-end="url(#bridge-mint-arrow)">
    <path d="M243 137h63"/>
    <path d="M372 137h79"/>
  </g>

  <rect class="known" x="53" y="112" width="57" height="50" rx="7"/>
  <path class="known-ink" d="M71 134a7 7 0 1 1 14 0 7 7 0 0 1-14 0Zm12 5 7 7"/>
  <rect class="known" x="182" y="110" width="57" height="54" rx="7"/>
  <path class="known-ink" d="M194 123h32m-32 10h25m-25 10h21m-21 10h13"/>
  <path d="M194 143h21" stroke="#1c766c" stroke-width="2.5" stroke-linecap="round"/>

  <rect class="future" x="311" y="112" width="57" height="50" rx="7"/>
  <path class="future-ink" d="M329 134a7 7 0 1 1 14 0 7 7 0 0 1-14 0Zm12 5 7 7m-29-24h8"/>
  <rect class="future" x="456" y="110" width="57" height="54" rx="7"/>
  <path class="future-ink" d="M468 123h32m-32 10h27m-27 10h21m-21 10h15"/>

  <g class="node-label" text-anchor="middle">
    <text x="82" y="188">Question</text>
    <text x="210" y="188">First clue</text>
    <text x="339" y="188">Bridge query</text>
    <text x="484" y="188">Source</text>
  </g>
  <path class="on-single" d="M25 228h18" stroke="#a66521" stroke-dasharray="3 3"/>
  <path class="on-repair" d="M25 228h18" stroke="#1c766c" stroke-width="2"/>
  <text class="path-note on-single" x="51" y="233">Supporting evidence can stay out of reach.</text>
  <text class="path-note on-repair" x="51" y="233">The extra search follows a clue from the initial result.</text>
</svg>
