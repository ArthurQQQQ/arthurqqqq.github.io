<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" data-active-step="1" role="img" aria-labelledby="bridge-title bridge-desc">
  <title id="bridge-title">Bridge Starvation mechanism</title>
  <desc id="bridge-desc">A first search may retrieve an initial clue while leaving its support unseen. A bounded extra search uses the bridge entity in the clue to look for the supporting passage.</desc>
  <defs>
    <pattern id="bridge-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#53668e" stroke-opacity=".33"/>
    </pattern>
    <marker id="bridge-blue-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#99b5ff" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="bridge-mint-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#79d9c3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <radialGradient id="bridge-clue-light">
      <stop stop-color="#6e96f6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#6e96f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bridge-follow-up-light">
      <stop stop-color="#5dbda9" stop-opacity=".36"/>
      <stop offset="1" stop-color="#5dbda9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #eceef9; }
    .heading { font: 22px Georgia, serif; }
    .band-label { fill: #b4bbd2; font-size: 14px; letter-spacing: .06em; }
    .node-label { font-size: 16px; font-weight: 560; }
    .path-note { fill: #b4bbd2; font-size: 14px; }
    .known { fill: #243a60; stroke: #99b5ff; stroke-width: 1.5; }
    .future { fill: #192130; stroke: #65759a; stroke-width: 1.5; }
    .known-ink { fill: none; stroke: #99b5ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .future-ink { fill: none; stroke: #91a2cd; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .gap { fill: none; stroke: #e0ad66; stroke-width: 1.5; stroke-dasharray: 4 5; }
    .path-note.step-one { fill: #f0be79; }
    .step-one, .step-two, .step-three, .repair-note { display: none; }
    .first-repair, .second-repair, .paper-light { opacity: 0; }
    svg[data-active-step="1"] .step-one,
    svg[data-active-step="2"] .step-two,
    svg[data-active-step="3"] .step-three,
    svg:is([data-active-step="2"], [data-active-step="3"]) .repair-note { display: inline; }
    svg:is([data-active-step="2"], [data-active-step="3"]) .first-repair { opacity: 1; }
    svg[data-active-step="3"] .second-repair { opacity: 1; }
    svg:is([data-active-step="2"], [data-active-step="3"]) .first-gap,
    svg[data-active-step="3"] .second-gap { opacity: 0; }
    svg:is([data-active-step="2"], [data-active-step="3"]) .bridge-node,
    svg[data-active-step="3"] .source-node { fill: #173932; stroke: #79d9c3; }
    svg:is([data-active-step="2"], [data-active-step="3"]) .bridge-icon,
    svg[data-active-step="3"] .source-icon { stroke: #79d9c3; }
    svg:is([data-active-step="2"], [data-active-step="3"]) .late-band { fill: #142e2c; stroke: #37685f; }
    svg[data-active-step="1"] .clue-light,
    svg[data-active-step="2"] .query-light,
    svg[data-active-step="3"] .source-light { opacity: calc(.55 + .4 * var(--scroll-accent, 0)); }
    @media (max-width: 400px) {
      .heading { font-size: 24px; }
      .band-label, .path-note { font-size: 16px; }
      .node-label { font-size: 18px; }
    }
    svg[data-scroll-driven] {
      --clue-weight: var(--weight-one, 1);
      --query-weight: var(--weight-two, 0);
      --source-weight: var(--weight-three, 0);
      --repair-weight: calc(var(--query-weight) + var(--source-weight));
    }
    svg[data-scroll-driven] .clue-light {
      opacity: calc(var(--clue-weight) * (.55 + .4 * var(--progress-one, 0)));
    }
    svg[data-scroll-driven] .query-light {
      opacity: calc(var(--query-weight) * (.55 + .4 * var(--progress-two, 0)));
    }
    svg[data-scroll-driven] .source-light {
      opacity: calc(var(--source-weight) * (.55 + .4 * var(--progress-three, 0)));
    }
    svg[data-scroll-driven] .known {
      fill: color-mix(in srgb, #1e2c46, #243a60 calc(var(--clue-weight) * 100%));
      stroke: color-mix(in srgb, #7388b6, #99b5ff calc(var(--clue-weight) * 100%));
    }
    svg[data-scroll-driven] .known-ink {
      stroke: color-mix(in srgb, #92a6d1, #99b5ff calc(var(--clue-weight) * 100%));
    }
    svg[data-scroll-driven] .initial-link { opacity: calc(.62 + .38 * var(--clue-weight)); }
    svg[data-scroll-driven] .bridge-node, svg[data-scroll-driven] .bridge-icon {
      --node-weight: var(--repair-weight);
    }
    svg[data-scroll-driven] .source-node, svg[data-scroll-driven] .source-icon {
      --node-weight: var(--source-weight);
    }
    svg[data-scroll-driven] :is(.bridge-node, .source-node) {
      fill: color-mix(in srgb, #192130, #173932 calc(var(--node-weight) * 100%));
      stroke: color-mix(in srgb, #65759a, #79d9c3 calc(var(--node-weight) * 100%));
    }
    svg[data-scroll-driven] :is(.bridge-icon, .source-icon) {
      stroke: color-mix(in srgb, #91a2cd, #79d9c3 calc(var(--node-weight) * 100%));
    }
    svg[data-scroll-driven] .late-band {
      fill: color-mix(in srgb, #1a2132, #142e2c calc(var(--repair-weight) * 100%));
      stroke: color-mix(in srgb, #394361, #37685f calc(var(--repair-weight) * 100%));
    }
    svg[data-scroll-driven] .first-gap { opacity: var(--clue-weight); }
    svg[data-scroll-driven] .first-repair { opacity: var(--repair-weight); }
    svg[data-scroll-driven] .second-gap { opacity: calc(1 - var(--source-weight)); }
    svg[data-scroll-driven] .second-repair { opacity: var(--source-weight); }

    .scroll-signal { display: none; pointer-events: none; }
    svg[data-scroll-driven] .scroll-signal {
      display: inline;
      opacity: var(--signal-weight);
      transform: translateX(calc(var(--signal-progress) * var(--travel)));
    }
    .signal-one {
      --signal-weight: var(--clue-weight);
      --signal-progress: var(--progress-one, 0);
    }
    .signal-two {
      --signal-weight: var(--query-weight);
      --signal-progress: var(--progress-two, 0);
    }
    .signal-three {
      --signal-weight: var(--source-weight);
      --signal-progress: var(--progress-three, 0);
    }
  </style>
  <rect width="560" height="250" fill="#141824"/>
  <rect x=".5" y=".5" width="559" height="249" rx="13" fill="none" stroke="#30374f"/>
  <text class="heading" x="25" y="35">Evidence path</text>
  <path d="M25 50h510" stroke="#3e4865"/>
  <rect x="24" y="65" width="249" height="141" rx="9" fill="#1b2337" stroke="#394361"/>
  <rect class="late-band" x="287" y="65" width="249" height="141" rx="9" fill="#1a2132" stroke="#394361"/>
  <ellipse class="paper-light clue-light" cx="210" cy="137" rx="55" ry="60" fill="url(#bridge-clue-light)"/>
  <ellipse class="paper-light query-light" cx="339" cy="137" rx="50" ry="61" fill="url(#bridge-follow-up-light)"/>
  <ellipse class="paper-light source-light" cx="484" cy="137" rx="51" ry="61" fill="url(#bridge-follow-up-light)"/>
  <path d="M33 66h231a8 8 0 0 1 8 8v123a8 8 0 0 1-8 8H33a8 8 0 0 1-8-8V74a8 8 0 0 1 8-8Zm263 0h231a8 8 0 0 1 8 8v123a8 8 0 0 1-8 8H296a8 8 0 0 1-8-8V74a8 8 0 0 1 8-8Z" fill="url(#bridge-grid)"/>
  <text class="band-label" x="38" y="87">INITIAL LOOKUP</text>
  <text class="band-label" x="301" y="87">FOLLOW-UP LOOKUP</text>

  <path class="initial-link" d="M114 137h63" stroke="#99b5ff" fill="none" stroke-width="1.6" marker-end="url(#bridge-blue-arrow)"/>
  <path class="gap first-gap" d="M243 137h63"/>
  <path class="gap second-gap" d="M372 137h79"/>
  <g fill="none" stroke="#79d9c3" stroke-width="1.8" marker-end="url(#bridge-mint-arrow)">
    <path class="first-repair" d="M243 137h63"/>
    <path class="second-repair" d="M372 137h79"/>
  </g>

  <rect class="known" x="53" y="112" width="57" height="50" rx="7"/>
  <path class="known-ink" d="M71 134a7 7 0 1 1 14 0 7 7 0 0 1-14 0Zm12 5 7 7"/>
  <rect class="known" x="182" y="110" width="57" height="54" rx="7"/>
  <path class="known-ink" d="M194 123h32m-32 10h25m-25 10h21m-21 10h13"/>
  <path d="M194 143h21" stroke="#79d9c3" stroke-width="2.5" stroke-linecap="round"/>

  <rect class="future bridge-node" x="311" y="112" width="57" height="50" rx="7"/>
  <path class="future-ink bridge-icon" d="M329 134a7 7 0 1 1 14 0 7 7 0 0 1-14 0Zm12 5 7 7m-29-24h8"/>
  <rect class="future source-node" x="456" y="110" width="57" height="54" rx="7"/>
  <path class="future-ink source-icon" d="M468 123h32m-32 10h27m-27 10h21m-21 10h15"/>

  <g class="node-label" text-anchor="middle">
    <text x="82" y="188">Question</text>
    <text x="210" y="188">First clue</text>
    <text x="339" y="188">Bridge query</text>
    <text x="484" y="188">Source</text>
  </g>
  <path class="step-one" d="M25 228h18" stroke="#e0ad66" stroke-dasharray="3 3"/>
  <path class="repair-note" d="M25 228h18" stroke="#79d9c3" stroke-width="2"/>
  <text class="path-note step-one" x="51" y="233">Supporting evidence can stay out of reach.</text>
  <text class="path-note step-two" x="51" y="233">Use the first clue to form a follow-up query.</text>
  <text class="path-note step-three" x="51" y="233">The follow-up search can recover the source.</text>
  <circle class="scroll-signal signal-one" cx="120" cy="137" r="2.9" fill="#c9d7ff" style="--travel: 50px"/>
  <circle class="scroll-signal signal-two" cx="249" cy="137" r="2.9" fill="#a7f3d9" style="--travel: 50px"/>
  <circle class="scroll-signal signal-three" cx="378" cy="137" r="2.9" fill="#ffe1b0" style="--travel: 66px"/>
</svg>
