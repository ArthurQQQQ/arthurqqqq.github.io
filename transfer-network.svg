<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" data-active-step="1" role="img" aria-labelledby="transfer-title transfer-desc">
  <title id="transfer-title">Two representations of college transfer</title>
  <desc id="transfer-desc">The statewide policy view connects illustrative states to policies they adopt. The institutional agreement view links illustrative colleges with bilateral agreements. Node locations and links are schematic.</desc>
  <defs>
    <pattern id="transfer-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#53668e" stroke-opacity=".33"/>
    </pattern>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #eceef9; }
    .heading { font: 22px Georgia, serif; }
    .band-label { fill: #b4bbd2; font-size: 14px; letter-spacing: .06em; }
    .node-label { font-size: 15px; font-weight: 560; }
    .path-note { fill: #b4bbd2; font-size: 14px; }
    .view-agreements { display: none; }
    svg[data-active-step="2"] .view-policies { display: none; }
    svg[data-active-step="2"] .view-agreements { display: inline; }
    .policy-edge { fill: none; stroke: #99b5ff; stroke-width: 1.55; stroke-opacity: .86; }
    .agreement-edge { fill: none; stroke: #79d9c3; stroke-width: 1.6; stroke-opacity: .88; }
    .state-node { fill: #243a60; stroke: #99b5ff; stroke-width: 1.6; }
    .policy-node { fill: #173932; stroke: #79d9c3; stroke-width: 1.6; }
    .college-node { fill: #173932; stroke: #79d9c3; stroke-width: 1.6; }
    @media (max-width: 400px) {
      .heading { font-size: 24px; }
      .band-label, .path-note { font-size: 16px; }
      .node-label { font-size: 17px; }
    }
  </style>
  <rect width="560" height="250" fill="#141824"/>
  <rect x=".5" y=".5" width="559" height="249" rx="13" fill="none" stroke="#30374f"/>
  <text class="heading" x="25" y="35">College transfer networks</text>
  <path d="M25 50h510" stroke="#3e4865"/>
  <rect x="24" y="65" width="512" height="141" rx="9" fill="#1b2337" stroke="#394361"/>
  <rect x="25" y="66" width="510" height="139" rx="8" fill="url(#transfer-grid)"/>

  <g class="view-policies">
    <text class="band-label" x="38" y="87">STATES</text>
    <text class="band-label" x="431" y="87">POLICIES</text>
    <path d="M266 94v94" stroke="#424e6b" stroke-dasharray="3 5"/>
    <path class="policy-edge" d="M152 113C230 113 321 120 399 120m-247-7c98 0 157 51 247 51m-247-16c103 0 140-28 247-28m-247 63c91 0 154-19 247-19"/>
    <g class="state-node">
      <rect x="132" y="105" width="16" height="16" rx="3"/>
      <rect x="132" y="140" width="16" height="16" rx="3"/>
      <rect x="132" y="175" width="16" height="16" rx="3"/>
    </g>
    <g class="policy-node">
      <path d="m411 110 10 10-10 10-10-10Z"/>
      <path d="m411 154 10 10-10 10-10-10Z"/>
    </g>
    <g class="node-label" text-anchor="end">
      <text x="116" y="119">State A</text>
      <text x="116" y="154">State B</text>
      <text x="116" y="189">State C</text>
    </g>
    <g class="node-label">
      <text x="435" y="126">Policy A</text>
      <text x="435" y="170">Policy B</text>
    </g>
    <path d="M25 228h18" stroke="#99b5ff" stroke-width="2"/>
    <text class="path-note" x="51" y="233">A link represents adoption of a statewide policy.</text>
  </g>

  <g class="view-agreements">
    <text class="band-label" x="38" y="87">INSTITUTIONAL AGREEMENTS</text>
    <path class="agreement-edge" d="M137 131 260 108m-123 23 108 43m15-66 135 19m-150 47 150-47m-150 47 150 8"/>
    <g class="college-node">
      <circle cx="137" cy="131" r="8"/>
      <circle cx="260" cy="108" r="8"/>
      <circle cx="245" cy="174" r="8"/>
      <circle cx="395" cy="127" r="8"/>
      <circle cx="395" cy="182" r="8"/>
    </g>
    <g class="node-label">
      <text x="120" y="136" text-anchor="end">College A</text>
      <text x="274" y="109">College B</text>
      <text x="230" y="191" text-anchor="end">College C</text>
      <text x="412" y="132">College D</text>
      <text x="412" y="188">College E</text>
    </g>
    <path d="M25 228h18" stroke="#79d9c3" stroke-width="2"/>
    <text class="path-note" x="51" y="233">A link represents an agreement between colleges.</text>
  </g>
</svg>
