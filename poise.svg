<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" data-active-step="1" role="img" aria-labelledby="poise-title poise-desc">
  <title id="poise-title">POISE operator selection mechanism</title>
  <desc id="poise-desc">A compound agent sees a shared reward from operators with different noise levels. POISE compares paired coalitions with and without an operator, then uses the estimated marginal credit to update selection.</desc>
  <defs>
    <pattern id="poise-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#53668e" stroke-opacity=".30"/>
    </pattern>
    <marker id="poise-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1l6 3-6 3" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <radialGradient id="poise-observe-light">
      <stop stop-color="#456bad" stop-opacity=".48"/>
      <stop offset="1" stop-color="#456bad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poise-credit-light">
      <stop stop-color="#3a8f79" stop-opacity=".48"/>
      <stop offset="1" stop-color="#3a8f79" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poise-select-light">
      <stop stop-color="#9f7747" stop-opacity=".48"/>
      <stop offset="1" stop-color="#9f7747" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #eceef9; }
    .heading { font: 22px Georgia, serif; }
    .band-label { fill: #b4bbd2; font-size: 14px; letter-spacing: .045em; }
    .node-label { font-size: 16px; font-weight: 560; }
    .operator-label { fill: #c1cae0; font-size: 13px; }
    .path-note { fill: #b4bbd2; font-size: 14px; }
    .panel {
      --stage-weight: 0;
      --strength: calc(var(--stage-weight) * 100%);
      opacity: calc(.84 + .16 * var(--stage-weight));
    }
    .observe { --tone: #99b5ff; --edge: #536d9b; --band: #1b2a43; --fill: #243a60; }
    .credit { --tone: #79d9c3; --edge: #37685f; --band: #142e2c; --fill: #173932; }
    .select { --tone: #e9bf8a; --edge: #73583b; --band: #2e261f; --fill: #3e3024; }
    svg[data-active-step="1"] .observe,
    svg[data-active-step="2"] .credit,
    svg[data-active-step="3"] .select { --stage-weight: 1; }
    svg[data-scroll-driven] .observe { --stage-weight: var(--weight-one, 1); }
    svg[data-scroll-driven] .credit { --stage-weight: var(--weight-two, 0); }
    svg[data-scroll-driven] .select { --stage-weight: var(--weight-three, 0); }
    .band {
      fill: #1a2132;
      stroke: #394361;
      fill: color-mix(in srgb, var(--band) var(--strength), #1a2132);
      stroke: color-mix(in srgb, var(--edge) var(--strength), #394361);
    }
    .box {
      fill: #192130;
      stroke: #65759a;
      fill: color-mix(in srgb, var(--fill) var(--strength), #192130);
      stroke: color-mix(in srgb, var(--tone) var(--strength), #65759a);
      stroke-width: 1.5;
    }
    .line {
      fill: none;
      stroke: #91a2cd;
      stroke: color-mix(in srgb, var(--tone) var(--strength), #91a2cd);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .flow { marker-end: url(#poise-arrow); }
    .uneven { stroke: #e2bc87; }
    .light { opacity: calc(.78 * var(--stage-weight)); }
    .step-note { display: none; }
    svg[data-active-step="1"] .note-observe,
    svg[data-active-step="2"] .note-credit,
    svg[data-active-step="3"] .note-select { display: inline; }
    .signal { display: none; pointer-events: none; }
    .signal-observe { --progress: var(--progress-one, 0); }
    .signal-credit { --progress: var(--progress-two, 0); }
    .signal-select { --progress: var(--progress-three, 0); }
    svg[data-scroll-driven] .signal {
      display: inline;
      opacity: var(--stage-weight);
      transform: translateX(calc(var(--progress) * var(--run)));
    }
    @media (max-width: 400px) {
      .heading { font-size: 24px; }
      .band-label { font-size: 15px; }
      .node-label { font-size: 17px; }
      .path-note { font-size: 15px; }
    }
  </style>
  <rect width="560" height="250" fill="#141824"/>
  <rect x=".5" y=".5" width="559" height="249" rx="13" fill="none" stroke="#30374f"/>
  <text class="heading" x="25" y="35">Operator credit under noise</text>
  <path d="M25 50h510" stroke="#3e4865"/>

  <g class="panel observe">
    <rect class="band" x="24" y="65" width="160" height="141" rx="9"/>
    <rect class="light" x="25" y="66" width="158" height="139" rx="8" fill="url(#poise-observe-light)"/>
    <rect x="25" y="66" width="158" height="139" rx="8" fill="url(#poise-grid)"/>
    <text class="band-label" x="37" y="87">NOISY OUTCOMES</text>
    <rect class="box" x="41" y="102" width="36" height="19" rx="4"/>
    <rect class="box" x="41" y="127" width="36" height="19" rx="4"/>
    <rect class="box" x="41" y="152" width="36" height="19" rx="4"/>
    <path class="line" d="M49 111h20m-20 50h20"/>
    <path class="line uneven" d="M49 137h5l3-4 4 8 3-4h5"/>
    <path class="line" d="M77 111h12l12 26m-24 24h12l12-24"/>
    <path class="line uneven" d="M77 137h24"/>
    <path class="line flow" d="M101 137h23"/>
    <rect class="box" x="128" y="113" width="39" height="48" rx="5"/>
    <path class="line" d="M137 147l6-13 5 6 6-12 4 8"/>
    <circle class="signal signal-observe" cx="103" cy="137" r="2.8" fill="#c9d7ff" style="--run: 17px"/>
    <text class="node-label" x="104" y="188" text-anchor="middle">Shared reward</text>
  </g>

  <g class="panel credit">
    <rect class="band" x="200" y="65" width="160" height="141" rx="9"/>
    <rect class="light" x="201" y="66" width="158" height="139" rx="8" fill="url(#poise-credit-light)"/>
    <rect x="201" y="66" width="158" height="139" rx="8" fill="url(#poise-grid)"/>
    <text class="band-label" x="213" y="87">ATTRIBUTION</text>
    <rect class="box" x="216" y="105" width="68" height="24" rx="5"/>
    <rect class="box" x="216" y="145" width="68" height="24" rx="5"/>
    <text class="operator-label" x="250" y="121" text-anchor="middle">With op.</text>
    <text class="operator-label" x="250" y="161" text-anchor="middle">Without</text>
    <path class="line" d="M284 117h7l9 20m-16 20h7l9-20"/>
    <path class="line flow" d="M300 137h15"/>
    <rect class="box" x="318" y="119" width="27" height="36" rx="5"/>
    <text class="node-label" x="331.5" y="143" text-anchor="middle">Δ</text>
    <circle class="signal signal-credit" cx="302" cy="137" r="2.8" fill="#a7f3d9" style="--run: 10px"/>
    <text class="node-label" x="280" y="188" text-anchor="middle">Paired differences</text>
  </g>

  <g class="panel select">
    <rect class="band" x="376" y="65" width="160" height="141" rx="9"/>
    <rect class="light" x="377" y="66" width="158" height="139" rx="8" fill="url(#poise-select-light)"/>
    <rect x="377" y="66" width="158" height="139" rx="8" fill="url(#poise-grid)"/>
    <text class="band-label" x="389" y="87">SELECTION</text>
    <rect class="box" x="393" y="102" width="35" height="19" rx="4"/>
    <rect class="box" x="393" y="127" width="35" height="19" rx="4"/>
    <rect class="box" x="393" y="152" width="35" height="19" rx="4"/>
    <path class="line" d="M400 111h21m-21 26h21m-21 24h21"/>
    <path class="line" d="M428 111h13l12 26m-25 26h13l12-26m-25 0h25" opacity=".78"/>
    <path class="line flow" d="M453 137h23"/>
    <rect class="box" x="480" y="114" width="40" height="46" rx="6"/>
    <path class="line" d="m490 137 7 7 13-15"/>
    <circle class="signal signal-select" cx="455" cy="137" r="2.8" fill="#ffe1b0" style="--run: 17px"/>
    <text class="node-label" x="456" y="188" text-anchor="middle">Update selection</text>
  </g>

  <g class="step-note note-observe">
    <path d="M25 228h18" stroke="#99b5ff" stroke-width="2"/>
    <text class="path-note" x="51" y="233">One operator’s noise can distort the shared reward.</text>
  </g>
  <g class="step-note note-credit">
    <path d="M25 228h18" stroke="#79d9c3" stroke-width="2"/>
    <text class="path-note" x="51" y="233">Compare matched coalitions with and without an operator.</text>
  </g>
  <g class="step-note note-select">
    <path d="M25 228h18" stroke="#e9bf8a" stroke-width="2"/>
    <text class="path-note" x="51" y="233">Use marginal credit to update operator selection.</text>
  </g>
</svg>
